# Self-hosted Renovate — ONLY manages packages/types/tygo/go.mod: Pulumi SDK
# bumps + TypeScript type regeneration via postUpgradeTasks, which the hosted
# Mend app cannot run for security reasons. Everything else (bun/npm, GitHub
# Actions, esc-eval/go.mod) is handled by the hosted Renovate GitHub App
# reading renovate.json.
#
# This run ignores renovate.json entirely (requireConfig: "ignored") — its
# config lives in .github/renovate-global.js. renovate.json carves out
# packages/types/tygo/** so the two instances never overlap.
#
# Prerequisites:
#   1. Hosted Renovate app installed on the repo (handles everything else)
#   2. A GitHub App with these repository permissions:
#        contents: write, pull_requests: write, issues: write
#   3. Install the app on the tektum org / procella repo
#   4. Add the app's ID and private key as repository secrets:
#        RENOVATE_APP_ID, RENOVATE_APP_PRIVATE_KEY
#
# A GitHub App is preferred over a PAT: permissions are scoped to the app,
# tokens are short-lived, and commits show as the app (not a personal account).
name: Renovate

on:
  schedule:
    - cron: "0 3 * * *" # daily — Pulumi SDK releases ~weekly, hourly was waste
  pull_request:
    paths:
      # renovate.json intentionally absent — this run ignores it (requireConfig)
      - .github/renovate-global.js
      - .github/workflows/renovate.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no PRs created/updated)"
        type: boolean
        default: false
      log_level:
        description: "Log level"
        type: choice
        options:
          - info
          - debug
          - trace
        default: info

concurrency:
  group: renovate
  # NEVER cancel-in-progress — Renovate is not idempotent mid-run
  # and cancellation can leave PRs in inconsistent state
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Exact security pin. Update manually after validating a new Renovate release.
  RENOVATE_VERSION: "44.65.5"

jobs:
  validate-config:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: namespace-profile-amd64-4cpu-8ram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Validate Renovate config
        run: bunx --package "renovate@$RENOVATE_VERSION" renovate-config-validator .github/renovate-global.js

  renovate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: namespace-profile-amd64-4cpu-8ram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Get GitHub App token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Bun + Go are needed on PATH for postUpgradeTasks.
      # Running Renovate directly on the runner (not Docker) means
      # mise-installed tools are available without volume-mount gymnastics.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/types/tygo/go.mod
          cache: false # no Go build cache needed — tygo install is fast

      - name: Verify tools
        run: |
          echo "bun: $(bun --version)"
          echo "go:  $(go version)"

      - name: Run Renovate
        env:
          RENOVATE_CONFIG_FILE: .github/renovate-global.js
          RENOVATE_TOKEN: ${{ steps.get_token.outputs.token }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}
        run: bunx "renovate@$RENOVATE_VERSION"
