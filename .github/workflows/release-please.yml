name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: true
    name: Create Release PRs
    runs-on: ubuntu-latest
    outputs:
      procella_released: ${{ steps.release.outputs.release_created }}
      procella_tag_name: ${{ steps.release.outputs.tag_name }}
      migrate_released: ${{ steps.release.outputs['packages/migrate--release_created'] }}
      migrate_tag_name: ${{ steps.release.outputs['packages/migrate--tag_name'] }}
    steps:
      - name: Get GitHub App token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.get_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-production:
    name: Deploy Production
    needs: release-please
    if: needs.release-please.outputs.procella_released == 'true'
    uses: ./.github/workflows/deploy-sst.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: production
      ref: ${{ needs.release-please.outputs.procella_tag_name }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PROCELLA_ENCRYPTION_KEY: ${{ secrets.PROCELLA_ENCRYPTION_KEY }}
      PROCELLA_DEV_AUTH_TOKEN: ${{ secrets.PROCELLA_DEV_AUTH_TOKEN }}
      DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
      PROCELLA_GITHUB_APP_ID: ${{ secrets.PROCELLA_GITHUB_APP_ID }}
      PROCELLA_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PROCELLA_GITHUB_APP_PRIVATE_KEY }}
      PROCELLA_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.PROCELLA_GITHUB_APP_WEBHOOK_SECRET }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  publish-migrate:
    name: Publish @procella/migrate
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.migrate_released == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.migrate_tag_name }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Verify quality gates
        run: |
          bunx biome check packages/migrate/
          bun run typecheck
          bun test packages/migrate/

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build for distribution
        working-directory: packages/migrate
        run: |
          # Use the dist-only tsconfig that excludes *.test.ts so tests don't
          # ship in the published npm package. The default tsconfig.json
          # includes tests so `bun run typecheck` covers them.
          bunx tsc -p tsconfig.build.json
          # Ensure shebang is preserved and cli.js is executable
          if [ -f dist/cli.js ] && ! head -n 1 dist/cli.js | grep -qx '#!/usr/bin/env node'; then
            { printf '%s\n' '#!/usr/bin/env node'; cat dist/cli.js; } > dist/cli.js.tmp && mv -f dist/cli.js.tmp dist/cli.js
          fi
          chmod +x dist/cli.js
          # Generate a publish-ready package.json with compiled paths
          bun -e '
            const pkg = require("./package.json");
            const dist = {
              name: pkg.name,
              version: pkg.version,
              description: pkg.description,
              type: pkg.type,
              license: pkg.license,
              repository: pkg.repository,
              keywords: pkg.keywords,
              engines: pkg.engines,
              bin: { "procella-migrate": "cli.js" },
              main: "index.js",
              types: "index.d.ts",
              exports: { ".": { import: "./index.js", types: "./index.d.ts" } },
            };
            require("fs").writeFileSync("dist/package.json", JSON.stringify(dist, null, 2));
          '
          cp -f ../../LICENSE dist/ 2>/dev/null || true

      - name: Publish to npm
        working-directory: packages/migrate/dist
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
