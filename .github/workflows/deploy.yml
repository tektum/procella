name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "SST stage to deploy"
        required: true
        type: choice
        options:
          - production
          - dev
      ref:
        description: "Git ref to deploy (tag, branch, or SHA). Defaults to current default branch HEAD."
        required: false

permissions:
  contents: read


concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: ${{ (inputs.stage || 'dev') != 'production' }}

jobs:
  deploy:
    uses: $/.github/workflows/deploy-sst.yml
    permissions:
      id-token: write
      contents: read
    with:
      stage: ${{ inputs.stage || 'dev' }}
      ref: ${{ inputs.ref || '' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PROCELLA_ENCRYPTION_KEY: ${{ secrets.PROCELLA_ENCRYPTION_KEY }}
      PROCELLA_DEV_AUTH_TOKEN: ${{ secrets.PROCELLA_DEV_AUTH_TOKEN }}
      DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
      PROCELLA_GITHUB_APP_ID: ${{ secrets.PROCELLA_GITHUB_APP_ID }}
      PROCELLA_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PROCELLA_GITHUB_APP_PRIVATE_KEY }}
      PROCELLA_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.PROCELLA_GITHUB_APP_WEBHOOK_SECRET }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
