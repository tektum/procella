name: Preview Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: preview-cleanup-${{ github.event.number }}

jobs:
  cleanup:
    name: Remove Preview Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Cleanup-${{ github.run_id }}

      - name: Drop stage database
        continue-on-error: true
        shell: bash {0}
        run: |
          set -x
          STAGE="pr-${{ github.event.number }}"
          DB_NAME="procella_${STAGE//-/_}"
          CLUSTER_IDS=$(aws rds describe-db-clusters \
            --query "DBClusters[?starts_with(DBClusterIdentifier, 'procella')].DBClusterIdentifier" \
            --output text)
          if [ -z "$CLUSTER_IDS" ] || [ "$CLUSTER_IDS" = "None" ]; then
            echo "No Aurora cluster found — skipping cleanup"
            exit 0
          fi
          for CLUSTER_ID in $CLUSTER_IDS; do
            CLUSTER_ARN=$(aws rds describe-db-clusters --db-cluster-identifier "$CLUSTER_ID" \
              --query "DBClusters[0].DBClusterArn" --output text)
            SECRET_ARN=$(aws rds describe-db-clusters --db-cluster-identifier "$CLUSTER_ID" \
              --query "DBClusters[0].MasterUserSecret.SecretArn" --output text)
            aws rds-data execute-statement \
              --resource-arn "$CLUSTER_ARN" \
              --secret-arn "$SECRET_ARN" \
              --database "postgres" \
              --sql "DROP DATABASE IF EXISTS \"$DB_NAME\"" 2>&1 || true
          done

      - name: Remove SST stack
        run: npx sst remove --stage pr-${{ github.event.number }}
      - name: Cleanup summary
        if: always()
        env:
          PR_NUMBER: ${{ github.event.number }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Preview Cleanup"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Stage | \`pr-$PR_NUMBER\` |"
            echo "| Status | \`$STATUS\` |"
            echo "| PR | #$PR_NUMBER |"
          } >> "$GITHUB_STEP_SUMMARY"
