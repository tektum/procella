name: Deploy SST

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        required: true
      PROCELLA_ENCRYPTION_KEY:
        required: true
      PROCELLA_DEV_AUTH_TOKEN:
        required: true
      DESCOPE_MANAGEMENT_KEY:
        required: true
      PROCELLA_GITHUB_APP_ID:
        required: true
      PROCELLA_GITHUB_APP_PRIVATE_KEY:
        required: true
      PROCELLA_GITHUB_APP_WEBHOOK_SECRET:
        required: true
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: true
      OTEL_EXPORTER_OTLP_HEADERS:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS (${{ inputs.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: esc-eval/go.mod
          cache: true
          cache-dependency-path: esc-eval/go.sum

      - name: Capture deployed ref
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            ~/.pulumi/plugins
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Download Go modules
        run: cd esc-eval && go mod download

      - name: Vet Go code
        run: cd esc-eval && go vet ./...

      - name: Test Go code
        run: cd esc-eval && go test ./... -race -count=1

      - name: Build deployment binaries
        uses: $/.github/actions/build-deployment

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Unlock stale state
        env:
          STAGE: ${{ inputs.stage }}
        run: npx sst unlock --stage "$STAGE"
        continue-on-error: true
      - name: Deploy
        env:
          STAGE: ${{ inputs.stage }}
          GITHUB_TOKEN: ${{ github.token }}
          SST_SECRET_ProcellaEncryptionKey: ${{ secrets.PROCELLA_ENCRYPTION_KEY }}
          SST_SECRET_ProcellaDevAuthToken: ${{ secrets.PROCELLA_DEV_AUTH_TOKEN }}
          SST_SECRET_ProcellaDescopeManagementKey: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
          SST_SECRET_ProcellaGitHubAppId: ${{ secrets.PROCELLA_GITHUB_APP_ID }}
          SST_SECRET_ProcellaGitHubAppPrivateKey: ${{ secrets.PROCELLA_GITHUB_APP_PRIVATE_KEY }}
          SST_SECRET_ProcellaGitHubAppWebhookSecret: ${{ secrets.PROCELLA_GITHUB_APP_WEBHOOK_SECRET }}
          SST_SECRET_ProcellaOtelEndpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          SST_SECRET_ProcellaOtelHeaders: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: npx sst deploy --stage "$STAGE"
      - name: Deployment summary
        if: always()
        env:
          STAGE: ${{ inputs.stage }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.meta.outputs.sha }}
          REF: ${{ inputs.ref || 'default' }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$STAGE" = production ]; then DOMAIN=procella.cloud; else DOMAIN="$STAGE.procella.cloud"; fi
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Stage | \`$STAGE\` |"
            echo "| Status | \`$STATUS\` |"
            echo "| Region | \`us-east-1\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Triggered by | $ACTOR |"
            echo ""
            echo "**URLs:**"
            echo "- API: https://api.$DOMAIN"
            echo "- App: https://app.$DOMAIN"
            echo "- Docs: https://docs.$DOMAIN"
          } >> "$GITHUB_STEP_SUMMARY"

